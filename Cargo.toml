[workspace]
resolver = "3"
members = [
    "crates/yori-diff",
    "crates/yori-document",
    "crates/yori",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/trixnz/yori"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Explicit owner preference: useful docs, not mandatory Errors/Panics boilerplate.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.dev]
split-debuginfo = "unpacked"
debug = "limited"

# Optimize third-party dependencies while keeping workspace crates quick to rebuild.
[profile.dev.package."*"]
opt-level = 3
