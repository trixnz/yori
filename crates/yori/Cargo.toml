[package]
name = "yori"
description = "Native source-file diff editor"
publish = false
version.workspace = true
edition.workspace = true
# Highest declared MSRV in the selected Linux GPUI dependency graph (oo7 0.6.0).
rust-version = "1.92"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
yori-document = { path = "../yori-document" }
yori-diff = { path = "../yori-diff" }
gpui-kit = { version = "=0.6.1", features = ["tree-sitter-c", "tree-sitter-cpp", "tree-sitter-go", "tree-sitter-rust"] }
ropey = "=2.0.0-beta.1"
unicode-width = "=0.2.2"
tree-sitter = "=0.26.13"
zbus = "=5.13.2"
async-channel = "=2.5.0"
notify = "=8.2.0"
tempfile = "=3.27.0"
rustix = { version = "=1.1.4", features = ["fs"] }

[dev-dependencies]
gpui-kit = { version = "=0.6.1", features = ["test-support"] }
