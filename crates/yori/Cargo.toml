[package]
name = "yori"
description = "Native source-file diff editor"
publish = false
version.workspace = true
edition.workspace = true
# Highest declared MSRV in the selected Linux GPUI dependency graph (oo7 0.6.0).
rust-version = "1.92"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
yori-document = { path = "../yori-document" }
yori-diff = { path = "../yori-diff" }
yori-p4 = { path = "../yori-p4" }
gpui-kit = { version = "=0.6.1", features = ["tree-sitter-c", "tree-sitter-cpp", "tree-sitter-go", "tree-sitter-rust"] }
ropey = "=2.0.0-beta.1"
unicode-width = "=0.2.2"
unicode-segmentation = "=1.13.3"
tree-sitter = "=0.26.13"
interprocess = "=2.4.4"
bitcode = "=0.6.9"
atomicwrites = "=0.4.4"
async-channel = "=2.5.0"
notify = "=8.2.0"
gix = { version = "=0.87.1", default-features = false, features = ["revision", "sha1", "status"] }
dirs = "=6.0.0"
toml_edit = "=0.22.27"

[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "=0.25.9", default-features = false, features = ["png"] }

[build-dependencies]
winresource = { version = "=0.1.31", default-features = false }

[dev-dependencies]
gpui-kit = { version = "=0.6.1", features = ["test-support"] }
tempfile = "=3.27.0"
